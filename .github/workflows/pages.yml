name: Release Focus Garden to Pages

on:
  workflow_dispatch:
    inputs:
      governance_approved:
        description: Human governance sign-off has been recorded
        required: true
        default: false
        type: boolean

concurrency:
  group: pages-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality and release checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:pwa
      - run: npm run audit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:perf
      - name: Upload non-sensitive quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-quality-reports
          path: |
            coverage/
            evidence/lighthouse/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build immutable Pages artifact
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:pwa
      - name: Stage production output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: focus-garden-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  upload:
    name: Upload Pages artifact
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download production output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: focus-garden-dist
          path: dist
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload exact release artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    name: Deploy signed-off release
    if: ${{ inputs.governance_approved == true }}
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
